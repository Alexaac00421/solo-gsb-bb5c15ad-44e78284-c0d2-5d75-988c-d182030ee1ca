services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: broadcast
      POSTGRES_PASSWORD: broadcast
      POSTGRES_DB: broadcast
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broadcast -d broadcast"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://broadcast:broadcast@db:5432/broadcast
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
